<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menova Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FFFFFF;--bg2:#F6F7FC;--card:#FFFFFF;--ink:#14161F;--mut:#767A8A;--pri:#2E3FE8;--pri-deep:#1F2BB8;--acc:#14C7A3;--gold:#2E3FE8;--line:#E6E8F0;--soft:#F6F7FC;--pri-soft:#EEF0FE;--danger:#DC2626;--danger-soft:#FDE2E2;--ok:#14C7A3;--ok-deep:#0E9E82;--ok-soft:#D8F7EF;
--sh-sm:0 1px 2px rgba(20,22,31,.08),0 3px 10px rgba(20,22,31,.06);
--sh-md:0 2px 6px rgba(20,22,31,.08),0 14px 30px -14px rgba(20,22,31,.28);
--sh-lg:0 30px 60px -22px rgba(10,45,38,.4);
--r:18px;--r-sm:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1120;--bg2:#1F2238;--card:#1A1E33;--ink:#F2F4FB;--mut:#9297AC;--pri:#5B6CFF;--pri-deep:#2E3FE8;--acc:#14C7A3;--gold:#8A94FF;--line:#2A2E45;--soft:#1F2238;--pri-soft:#262B4D;--danger:#F87171;--danger-soft:#3A1D22;--ok:#14C7A3;--ok-deep:#0E9E82;--ok-soft:#0F2E29;--sh-sm:0 1px 2px rgba(0,0,0,.45);--sh-md:0 2px 6px rgba(0,0,0,.45),0 14px 30px -14px rgba(0,0,0,.7);--sh-lg:0 30px 60px -22px rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--bg:#0F1120;--bg2:#1F2238;--card:#1A1E33;--ink:#F2F4FB;--mut:#9297AC;--pri:#5B6CFF;--pri-deep:#2E3FE8;--acc:#14C7A3;--gold:#8A94FF;--line:#2A2E45;--soft:#1F2238;--pri-soft:#262B4D;--danger:#F87171;--danger-soft:#3A1D22;--ok:#14C7A3;--ok-deep:#0E9E82;--ok-soft:#0F2E29;--sh-sm:0 1px 2px rgba(0,0,0,.45);--sh-md:0 2px 6px rgba(0,0,0,.45),0 14px 30px -14px rgba(0,0,0,.7);--sh-lg:0 30px 60px -22px rgba(0,0,0,.75)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",Calibri,Arial,system-ui,sans-serif;background-color:var(--bg);background-image:radial-gradient(1100px 480px at 50% -8%,var(--bg2),transparent),radial-gradient(700px 380px at 100% 0%,var(--pri-soft),transparent)}
h3,h4{font-family:"Plus Jakarta Sans",Calibri,Arial,sans-serif;font-weight:800;letter-spacing:-.2px}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--card);color:var(--ink);box-shadow:var(--sh-sm);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.brandmark{width:36px;height:36px;flex:none;border-radius:11px;background:linear-gradient(135deg,#5B6CFF,var(--pri-deep) 70%);display:grid;place-items:center;font-family:"Plus Jakarta Sans",Calibri,Arial,sans-serif;font-weight:800;font-size:20px;color:#fff;box-shadow:0 6px 14px -6px rgba(46,63,232,.6)}
header b{font-family:"Plus Jakarta Sans",Calibri,Arial,sans-serif;font-weight:800;font-size:20px;letter-spacing:2px}header span{opacity:.8;font-size:13px}
.conn{font-size:11px;font-weight:700;background:var(--soft);color:var(--mut);padding:4px 11px;border-radius:99px;opacity:1}
.tabs{display:flex;gap:4px;padding:10px 14px 0;max-width:480px;margin:0 auto}
.tabs button{flex:1;border-radius:14px}
button{font:800 14px/1 "Plus Jakarta Sans",Calibri,Arial,sans-serif;cursor:pointer;border:1px solid transparent;border-radius:999px;padding:10px 16px;background:var(--soft);color:var(--ink);transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
button:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
button:active{transform:translateY(0) scale(.98)}
button.p{background:linear-gradient(135deg,#5B6CFF,var(--pri-deep));color:#fff;box-shadow:0 10px 20px -10px rgba(46,63,232,.55)}
button.a{background:linear-gradient(135deg,#0C6B56,#09503F);color:#fff;box-shadow:0 10px 20px -10px rgba(11,107,87,.6)}
button.on{background:linear-gradient(135deg,#5B6CFF,var(--pri-deep));color:#fff;border-color:transparent;box-shadow:0 8px 16px -8px rgba(46,63,232,.5)}
button.ok{background:linear-gradient(135deg,#15803D,#166534);color:#fff;box-shadow:0 10px 20px -10px rgba(21,128,61,.55)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{display:grid;grid-template-columns:1fr;gap:18px;padding:14px;max-width:1280px;margin:0 auto}
@media(min-width:900px){main{grid-template-columns:400px 1fr;align-items:start}.tabs{display:none}.pane{display:block!important}}
@media(max-width:899px){main{padding:10px}.tabs{padding:8px 10px 0}.phone{min-height:430px;height:calc(100vh - 132px);height:calc(100dvh - 132px)}}
.pane{display:none}.pane.show{display:block}
.phone{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;min-height:620px;display:flex;flex-direction:column;max-width:390px;margin:6px auto;box-shadow:var(--sh-lg)}
.ph-top{background:linear-gradient(120deg,#2E3FE8,#1F2BB8);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.ph-top b{font-family:"Plus Jakarta Sans",Calibri,Arial,sans-serif;font-weight:800;letter-spacing:.5px;font-size:16px}
.ph-body{padding:10px 12px 14px;flex:1;overflow:auto;max-height:640px;min-height:0}
.ph-body::-webkit-scrollbar{width:8px}
.ph-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;position:sticky;top:-10px;background:linear-gradient(var(--card) 85%,transparent);z-index:1}
.cats button{white-space:nowrap;padding:8px 14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-sm);font-size:13px}
.item{display:flex;gap:11px;align-items:center;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh-sm)}
.em{font-size:24px;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--pri-soft),var(--soft));display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:14px}.mut{color:var(--mut);font-size:13px}
.price{display:inline-block;font-weight:800;font-size:14px;color:var(--pri);margin-right:6px}
.stock{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--pri-soft);color:var(--pri)}
.stock.out{background:var(--danger-soft);color:var(--danger)}
.qty{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.qty button{padding:3px 11px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.qty button.p{border-color:transparent}
.qty b{min-width:18px;text-align:center;font-size:14px}
.bar{padding:12px;background:var(--card);border-top:1px solid var(--line);position:sticky;bottom:0;z-index:1}
.center{text-align:center}
.steps{display:flex;justify-content:space-between;margin:20px 0;position:relative}
.steps::before{content:"";position:absolute;top:15px;left:14%;right:14%;height:2px;background:var(--line)}
.step{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative;z-index:1}
.step i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;margin:0 auto 4px;background:var(--card);border:2px solid var(--line);font-style:normal;font-weight:800}
.step.done{color:var(--ink)}.step.done i{background:linear-gradient(135deg,#15803D,#166534);border-color:transparent;color:#fff;box-shadow:0 6px 12px -6px rgba(21,128,61,.5)}
input,select{font:600 14px "Plus Jakarta Sans",Calibri,Arial,sans-serif;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.dash{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh-md)}
.dtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dtabs button{background:var(--soft);border:1px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.col{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:160px}
.col h4{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.ord{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;border-left:5px solid var(--pri);box-shadow:var(--sh-sm)}
.ord.s1{border-color:var(--line);border-left-color:var(--acc)}.ord.s2{border-color:var(--line);border-left-color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 10px;border-radius:99px;background:linear-gradient(135deg,var(--pri),var(--pri-deep));color:#fff}
.row{display:grid;grid-template-columns:34px 1.4fr 1fr .7fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;background:var(--card)}
.row input{padding:7px 9px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:linear-gradient(135deg,var(--pri-deep),var(--pri));border-radius:var(--r);padding:16px;color:rgba(255,255,255,.85);font-size:12px;font-weight:700;border:none;box-shadow:var(--sh-md)}
.stat b{font-size:24px;display:block;color:#fff;font-family:"Plus Jakarta Sans",Calibri,Arial,sans-serif;font-weight:800}
.payst{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.payst.belum_bayar{background:var(--soft);color:var(--mut)}
.payst.menunggu_verifikasi{background:var(--pri-soft);color:var(--pri-deep);border-color:transparent}
.payst.lunas{background:var(--ok-soft);color:var(--ok-deep);border-color:transparent}
.payst.ditolak{background:var(--danger-soft);color:var(--danger);border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .payst.menunggu_verifikasi{color:#AAB4FF}:root:not([data-theme="light"]) .payst.lunas{color:#5EEAD4}:root:not([data-theme="light"]) .stock{color:#AAB4FF}:root:not([data-theme="light"]) .price{color:#8A94FF}}
:root[data-theme="dark"] .payst.menunggu_verifikasi{color:#AAB4FF}:root[data-theme="dark"] .payst.lunas{color:#5EEAD4}:root[data-theme="dark"] .stock{color:#AAB4FF}:root[data-theme="dark"] .price{color:#8A94FF}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14161F;color:#fff;padding:12px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.14);box-shadow:var(--sh-lg);opacity:0;transition:.3s;pointer-events:none;z-index:9;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
tr:nth-child(even) td{background:var(--soft)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.conn{font-size:11px;font-weight:700;background:rgba(255,255,255,.15);padding:4px 11px;border-radius:99px;opacity:1}
.qrbox{width:216px;height:216px;margin:14px auto;padding:12px;background:#fff;border:1px solid var(--line);border-radius:20px;display:grid;place-items:center;overflow:hidden;line-height:0;box-shadow:var(--sh-md)}
.qrbox img,.qrbox canvas{width:190px!important;height:190px!important;max-width:190px;max-height:190px}
.qrbox table{border-collapse:collapse}
body.kiosk .tabs{display:none!important}
body.kiosk #pd{display:none!important}
body.kiosk main{grid-template-columns:1fr!important;max-width:480px}
body.kiosk .pane{display:none}body.kiosk #pc{display:block!important}
</style>
</head>
<body>
<header><span class="brandmark">M</span><b>MENOVA</b><span id="hsub">Simulator • Scan QR → Pesan → Dashboard</span>
<span id="hact" style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="conn" id="conn">menghubungkan…</span><button onclick="resetAll()" style="padding:6px 10px">Reset demo</button></span></header>
<div class="tabs" id="tabs"><button id="tc" class="on" onclick="pane('c')">📱 Pelanggan</button><button id="td" onclick="pane('d')">🧾 Dashboard <span id="badge"></span></button></div>
<main>
<section class="pane show" id="pc"><div class="phone" id="phone"></div></section>
<section class="pane" id="pd"><div class="dash"><div class="dtabs" id="dtabs"></div><div id="dbody"></div></div></section>
</main>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://etqjntpaiaxpdswmflif.supabase.co';
const SUPABASE_KEY='sb_publishable_xBDxYjEr5IZX7DbMpNxelQ_z-K9M5hq';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ST=['Diterima','Diproses','Selesai'];
const PAYST={belum_bayar:'Belum Bayar',menunggu_verifikasi:'Menunggu Verifikasi',lunas:'Lunas',ditolak:'Ditolak'};
const QRIS_IMG='qris.png';
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEED=[
{id:1,name:'Espresso',cat:'Kopi',price:18000,stock:20,em:'☕'},
{id:2,name:'Americano',cat:'Kopi',price:20000,stock:20,em:'☕'},
{id:3,name:'Kopi Susu Gula Aren',cat:'Kopi',price:24000,stock:25,em:'🧋'},
{id:4,name:'Latte',cat:'Kopi',price:26000,stock:15,em:'🥛'},
{id:5,name:'Matcha Latte',cat:'Non-Kopi',price:28000,stock:12,em:'🍵'},
{id:6,name:'Teh Tarik',cat:'Non-Kopi',price:18000,stock:20,em:'🫖'},
{id:7,name:'Coklat Panas',cat:'Non-Kopi',price:24000,stock:10,em:'🍫'},
{id:8,name:'Roti Bakar',cat:'Makanan',price:20000,stock:12,em:'🍞'},
{id:9,name:'Nasi Goreng',cat:'Makanan',price:32000,stock:10,em:'🍳'},
{id:10,name:'Kentang Goreng',cat:'Makanan',price:22000,stock:3,em:'🍟'}];
let S={menu:[],orders:[]};
let cart={},table=5,step='scan',cat='Semua',myId=null,dtab='orders',payMethod='tunai',custName='',custNote='';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function setConn(m){document.getElementById('conn').textContent=m}
function pane(w){if(isKiosk())w='c';document.getElementById('pc').classList.toggle('show',w=='c');document.getElementById('pd').classList.toggle('show',w=='d');
const tc=document.getElementById('tc'),td=document.getElementById('td');
if(tc)tc.classList.toggle('on',w=='c');if(td)td.classList.toggle('on',w=='d')}
const normMenu=r=>({id:Number(r.id),name:r.name,cat:r.category??r.cat??'Lainnya',price:Number(r.price),stock:Number(r.stock),em:r.emoji??r.em??'🍽️'});
function normOrderFn(o){
  const items=(o.order_items||o.items||[]).map(i=>({name:i.name,price:Number(i.price),q:Number(i.qty??i.q),mid:i.menu_id??i.mid}));
  let time=o.time;
  if(!time&&o.created_at){try{time=new Date(o.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch(e){time=''}}
  return {id:o.id,table:o.table_number??o.table,name:o.customer_name??o.name??'',note:o.note??'',status:o.status,total:Number(o.total),time:time||'',items,pay:o.payment_method??'tunai',payst:o.payment_status??'lunas',proof:o.proof_url??''};
}
const find=id=>S.menu.find(m=>m.id==id);
const cartList=()=>Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({m:find(id),q})).filter(x=>x.m);
const cartTotal=()=>cartList().reduce((a,x)=>a+x.m.price*x.q,0);
const cartQty=()=>cartList().reduce((a,x)=>a+x.q,0);
function tableLink(t){try{const u=new URL(location.href);u.search='?table='+t;return u.toString()}catch(e){return '?table='+t}}
function isKiosk(){try{const t=Number(new URLSearchParams(location.search).get('table'));return t>=1&&t<=8}catch(e){return false}}
function applyKiosk(){if(!isKiosk())return;document.body.classList.add('kiosk');
const tb=document.getElementById('tabs');if(tb)tb.style.display='none';
const pd=document.getElementById('pd');if(pd)pd.style.display='none';
const ha=document.getElementById('hact');if(ha)ha.style.display='none';
const hs=document.getElementById('hsub');if(hs)hs.textContent='Scan QR → Pesan';pane('c')}

/* ---------- QR asli (bisa di-scan) ---------- */
function drawQR(elId,text){const el=document.getElementById(elId);if(!el)return;el.innerHTML='';
if(window.QRCode){new QRCode(el,{text,width:190,height:190,correctLevel:QRCode.CorrectLevel.M})}
else{el.innerHTML=`<p class="mut">QR lib gagal dimuat.<br>${esc(text)}</p>`}}

/* ---------- FETCH ---------- */
async function fetchMenus(){
  const {data,error}=await sb.from('menus').select('*').order('id');
  if(error)throw error;
  S.menu=(data||[]).map(normMenu);
}
async function fetchOrders(){
  const {data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(200);
  if(error)throw error;
  S.orders=(data||[]).map(normOrderFn);
  if(myId!=null&&!S.orders.some(o=>String(o.id)===String(myId))){
    const {data:one}=await sb.from('orders').select('*,order_items(*)').eq('id',myId).maybeSingle();
    if(one&&!S.orders.some(o=>String(o.id)===String(one.id)))S.orders.unshift(normOrderFn(one));
  }
}
async function fetchAll(){
  setConn('memuat…');
  await Promise.all([fetchMenus(),fetchOrders()]);
  setConn('online • Supabase');
  renderC();renderD();
}
function subscribe(){
  sb.channel('menova')
    .on('postgres_changes',{event:'*',schema:'public',table:'menus'},async()=>{try{await fetchMenus();renderC();renderD()}catch(e){}})
    .on('postgres_changes',{event:'*',schema:'public',table:'orders'},async()=>{try{await fetchOrders();renderC();renderD()}catch(e){}})
    .on('postgres_changes',{event:'*',schema:'public',table:'order_items'},async()=>{try{await fetchOrders();renderC();renderD()}catch(e){}})
    .subscribe();
}

/* ---------- PELANGGAN ---------- */
function renderC(){const p=document.getElementById('phone');let h='',foot='';
const kiosk=isKiosk();
if(kiosk&&step=='scan')step='menu';
const top=(t,back)=>`<div class="ph-top"><span>${back&&!kiosk?`<button onclick="${back}" style="padding:2px 9px">←</button> `:''}<b>${t}</b></span><span class="mut" style="color:#ECE4D6">Meja ${table}</span></div>`;
if(step=='scan'){
const link=tableLink(table);
h=top('Menova')+`<div class="ph-body center"><p class="mut" style="margin-top:20px">Pelanggan scan QR meja untuk pesan</p><div class="qrbox" id="qrbox"></div>
<label>Pilih meja</label><select onchange="table=+this.value;renderC()">${[1,2,3,4,5,6,7,8].map(i=>`<option ${i==table?'selected':''} value="${i}">Meja ${i}</option>`).join('')}</select>
<p class="mut" style="word-break:break-all">Link asli meja: <b>${esc(link)}</b></p>
<p><button style="width:100%;padding:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(link)}').then(()=>toast('Link disalin'))">Salin link meja</button></p>
<p><button class="p" style="width:100%;padding:13px" onclick="step='menu';renderC()">📷 Scan QR Meja ${table}</button></p></div>`;
p.innerHTML=h+foot;drawQR('qrbox',link);return}
else if(step=='menu'){
if(!S.menu.length){h=top('Kafe Menova','step=\'scan\';renderC()')+`<div class="ph-body"><p class="mut">Memuat menu…</p></div>`;p.innerHTML=h+foot;return}
const cats=['Semua',...new Set(S.menu.map(m=>m.cat))];
h=top('Kafe Menova','step=\'scan\';renderC()')+`<div class="ph-body"><div class="cats">${cats.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';renderC()">${esc(c)}</button>`).join('')}</div>`+
S.menu.filter(m=>cat=='Semua'||m.cat==cat).map(m=>{const q=cart[m.id]||0,left=m.stock-q;
return `<div class="item"><div class="em">${esc(m.em)}</div><div class="t"><b>${esc(m.name)}</b><span class="price">${rp(m.price)}</span><span class="stock${m.stock<=0?' out':''}">${m.stock<=0?'Habis':'Stok '+m.stock}</span></div>
<div class="qty">${q?`<button onclick="chg(${m.id},-1)">−</button><b>${q}</b>`:''}<button class="p" ${left<=0?'disabled':''} onclick="chg(${m.id},1)">+</button></div></div>`}).join('')+'</div>';
if(cartQty())foot=`<div class="bar"><button class="p" style="width:100%;padding:12px" onclick="step='cart';renderC()">Lihat keranjang • ${cartQty()} item • ${rp(cartTotal())}</button></div>`}
else if(step=='cart'){
h=top('Keranjang',"step='menu';renderC()")+`<div class="ph-body">`+cartList().map(x=>`<div class="item"><div class="em">${esc(x.m.em)}</div><div class="t"><b>${esc(x.m.name)}</b><span class="mut">${rp(x.m.price)}</span></div>
<div class="qty"><button onclick="chg(${x.m.id},-1)">−</button><b>${x.q}</b><button class="p" ${x.m.stock-x.q<=0?'disabled':''} onclick="chg(${x.m.id},1)">+</button></div></div>`).join('')+
(kiosk?`<p class="mut">Meja <b>${table}</b> (terkunci dari QR)</p>`:`<label>Nomor meja</label><select onchange="table=+this.value">${[1,2,3,4,5,6,7,8].map(i=>`<option ${i==table?'selected':''} value="${i}">Meja ${i}</option>`).join('')}</select>`)+
`<label>Nama (opsional)</label><input id="cn" placeholder="Nama pemesan"><label>Catatan</label><input id="cx" placeholder="Contoh: less sugar"></div>`;
foot=`<div class="bar"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Total</span><b>${rp(cartTotal())}</b></div><button class="a" style="width:100%;padding:12px" onclick="goPay()">Lanjut ke Pembayaran</button></div>`}
else if(step=='pay'){
const items=cartList();if(!items.length){step='menu';renderC();return}
h=top('Pembayaran',"step='cart';renderC()")+`<div class="ph-body center"><div style="display:flex;justify-content:space-between;margin:6px 0"><span>Total bayar</span><b>${rp(cartTotal())}</b></div><div class="cats" style="justify-content:center"><button class="${payMethod=='tunai'?'on':''}" onclick="payMethod='tunai';renderC()">Tunai</button><button class="${payMethod=='qris'?'on':''}" onclick="payMethod='qris';renderC()">QRIS</button></div>`+(payMethod=='tunai'?`<p class="mut">Bayar tunai di kasir.<br>Tunjukkan nomor pesanan setelah dibuat.</p><p><button class="a" style="width:100%;padding:12px" onclick="submitOrder('tunai')">Buat Pesanan • Bayar di Kasir</button></p>`:`<p class="mut">Scan QRIS berikut sebesar <b>${rp(cartTotal())}</b></p><img src="${QRIS_IMG}" style="width:210px;max-width:100%;border-radius:12px;background:#fff;padding:8px" onerror="this.style.display='none';document.getElementById('qris-missing').style.display='block'"><p class="mut" id="qris-missing" style="display:none">QRIS toko belum dipasang. Pilih Tunai atau hubungi kasir.</p><label style="text-align:left">Upload bukti transfer</label><input type="file" id="proof" accept="image/*"><p><button class="a" style="width:100%;padding:12px" onclick="submitOrder('qris')">Kirim Bukti & Buat Pesanan</button></p>`)+`</div>`;
p.innerHTML=h;return}
else{const o=S.orders.find(x=>String(x.id)===String(myId));
if(!o){step='menu';return renderC()}
const si=ST.indexOf(o.status);
const payBanner=o.payst=='lunas'?'':o.payst=='ditolak'?`<p class="mut">Pembayaran ditolak kasir. Hubungi kasir atau buat pesanan baru.</p>`:o.payst=='menunggu_verifikasi'?`<p class="mut">Bukti diterima, menunggu verifikasi kasir.</p>`:`<p class="mut">Tunjukkan nomor <b>#${o.id}</b> ke kasir untuk bayar tunai.</p>`;
h=top('Status pesanan')+`<div class="ph-body"><div class="center"><div style="font-size:42px">${si==2?'✅':si==1?'👨‍🍳':'📨'}</div><h3 style="margin:4px 0">Pesanan #${o.id}</h3>
<p class="mut">${si==0?'Pesanan diterima kafe, menunggu diproses.':si==1?'Pesanan sedang disiapkan.':'Pesanan selesai! Selamat menikmati.'}</p>${payBanner}</div>
<div class="steps">${ST.map((s,i)=>`<div class="step ${i<=si?'done':''}"><i>${i<=si?'✓':i+1}</i>${s}</div>`).join('')}</div>
${o.items.map(i=>`<div style="display:flex;justify-content:space-between"><span>${i.q}× ${esc(i.name)}</span><span>${rp(i.q*i.price)}</span></div>`).join('')}
<hr style="border:0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b>Total</b><b>${rp(o.total)}</b></div>
<p class="mut">Status update realtime dari dashboard.</p></div>`;
foot=`<div class="bar"><button class="p" style="width:100%;padding:12px" onclick="step='menu';cat='Semua';renderC()">Pesan lagi</button></div>`}
p.innerHTML=h+foot}
function chg(id,d){const m=find(id);if(!m)return;const q=(cart[id]||0)+d;if(q<0||q>m.stock)return;cart[id]=q;if(!q)delete cart[id];if(!cartQty()&&step=='cart')step='menu';renderC()}
function goPay(){custName=(document.getElementById('cn').value||'').trim();custNote=(document.getElementById('cx').value||'').trim();if(!cartQty())return toast('Keranjang kosong');step='pay';renderC()}
async function submitOrder(method){const items=cartList();if(!items.length)return;
const proofFile=(method=='qris'&&document.getElementById('proof')&&document.getElementById('proof').files[0])||null;
const total=cartTotal();
const pstat=method=='qris'?'menunggu_verifikasi':'belum_bayar';
try{
setConn('mengirim…');
const {data:ord,error:e1}=await sb.from('orders').insert({table_number:table,customer_name:custName,note:custNote,status:ST[0],total,payment_method:method,payment_status:pstat}).select().single();
if(e1)throw e1;
const rows=items.map(i=>({order_id:ord.id,menu_id:i.m.id,name:i.m.name,price:i.m.price,qty:i.q}));
const {error:e2}=await sb.from('order_items').insert(rows);
if(e2)throw e2;
if(proofFile){try{
const path='order-'+ord.id+'/'+Date.now()+'.jpg';
const {error:ue}=await sb.storage.from('payment-proofs').upload(path,proofFile,{upsert:true});
if(ue)throw ue;
const pub=sb.storage.from('payment-proofs').getPublicUrl(path);
await sb.from('orders').update({proof_url:pub.data.publicUrl}).eq('id',ord.id);
}catch(pe){toast('Pesanan dibuat, tapi bukti gagal diupload: '+(pe.message||pe))}}
myId=ord.id;cart={};step='track';
await fetchAll();toast('Pesanan #'+ord.id+' dibuat');
}catch(e){toast('Gagal kirim: '+(e.message||e));setConn('online • Supabase')}}

/* ---------- DASHBOARD ---------- */
function renderD(){if(isKiosk())return;const act=S.orders.filter(o=>(o.payst!='lunas'&&o.payst!='ditolak')||(o.payst=='lunas'&&o.status!=ST[2])).length;
document.getElementById('badge').textContent=act?'('+act+')':'';
const wc=S.orders.filter(o=>o.payst=='belum_bayar'||o.payst=='menunggu_verifikasi').length;
document.getElementById('dtabs').innerHTML=[['orders','Pesanan'],['pay','Bayar'+(wc?' ('+wc+')':'')],['menu','Kelola Menu'],['sum','Ringkasan']].map(([k,l])=>`<button class="${dtab==k?'on':''}" onclick="dtab='${k}';renderD()">${l}</button>`).join('');
const b=document.getElementById('dbody');
if(dtab=='orders'){b.innerHTML=`<div class="cols">`+ST.map((s,i)=>{const L=S.orders.filter(o=>o.status==s&&o.payst=='lunas');
return `<div class="col"><h4>${s}<span class="tag">${L.length}</span></h4>`+(L.length?L.map(o=>`<div class="ord s${i}"><div style="display:flex;justify-content:space-between"><b>#${o.id} • Meja ${o.table}</b><span class="mut">${esc(o.time)}</span></div>
${o.name?`<div class="mut">${esc(o.name)}</div>`:''}${o.items.map(t=>`<div>${t.q}× ${esc(t.name)}</div>`).join('')}${o.note?`<div class="mut">📝 ${esc(o.note)}</div>`:''}
<div style="margin:6px 0"><b>${rp(o.total)}</b></div>${i<2?`<button class="p" style="width:100%" onclick="adv(${o.id})">→ ${ST[i+1]}</button>`:''}</div>`).join(''):'<div class="mut">Kosong</div>')+'</div>'}).join('')+'</div>'}
else if(dtab=='pay'){const W=S.orders.filter(o=>o.payst=='belum_bayar'||o.payst=='menunggu_verifikasi');const R=S.orders.filter(o=>o.payst=='ditolak').slice(0,10);
b.innerHTML=(W.length?W.map(o=>`<div class="ord s0"><div style="display:flex;justify-content:space-between"><b>#${o.id} • Meja ${o.table}</b><span class="mut">${esc(o.time)}</span></div><div><span class="tag">${o.pay=='qris'?'QRIS':'Tunai'}</span><span class="payst ${o.payst}">${PAYST[o.payst]||o.payst}</span></div>${o.name?`<div class="mut">${esc(o.name)}</div>`:''}${o.items.map(t=>`<div>${t.q}× ${esc(t.name)}</div>`).join('')}${o.note?`<div class="mut">📝 ${esc(o.note)}</div>`:''}<div style="margin:6px 0"><b>${rp(o.total)}</b></div>${o.proof?`<p><a href="${esc(o.proof)}" target="_blank">Lihat bukti transfer</a></p>`:''}<div style="display:flex;gap:6px"><button class="ok" style="flex:1" onclick="confirmPaid(${o.id})">Konfirmasi Lunas</button><button style="flex:1" onclick="rejectOrder(${o.id})">Tolak</button></div></div>`).join(''):'<p class="mut">Tidak ada pembayaran menunggu.</p>')+(R.length?`<h4>Ditolak</h4>`+R.map(o=>`<div class="mut">#${o.id} • Meja ${o.table} • ${rp(o.total)}</div>`).join(''):'')}
else if(dtab=='menu'){b.innerHTML=`<div class="scroll">`+S.menu.map(m=>`<div class="row"><span style="font-size:22px">${esc(m.em)}</span>
<input value="${esc(m.name)}" onchange="upd(${m.id},'name',this.value)"><input type="number" min="0" step="500" value="${m.price}" onchange="upd(${m.id},'price',+this.value)">
<input type="number" min="0" value="${m.stock}" onchange="upd(${m.id},'stock',+this.value)"><button onclick="del(${m.id})" title="Hapus">🗑</button></div>`).join('')+`</div>
<p class="mut">Perubahan tersimpan ke Supabase dan tampil realtime di semua device.</p>
<h4>Tambah menu</h4><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">
<input id="an" placeholder="Nama menu"><input id="ap" type="number" placeholder="Harga"><input id="as" type="number" placeholder="Stok"><input id="ac" placeholder="Kategori" list="cl"><input id="ae" placeholder="Emoji" maxlength="4">
<datalist id="cl">${[...new Set(S.menu.map(m=>m.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><button class="p" onclick="addM()">Tambah</button></div>`}
else{const done=S.orders.filter(o=>o.status==ST[2]&&o.payst=='lunas'),rev=S.orders.filter(o=>o.payst=='lunas').reduce((a,o)=>a+Number(o.total||0),0),cnt={};
S.orders.filter(o=>o.payst=='lunas').forEach(o=>o.items.forEach(i=>cnt[i.name]=(cnt[i.name]||0)+i.q));
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
b.innerHTML=`<div class="stats"><div class="stat">Total penjualan<b>${rp(rev)}</b></div><div class="stat">Jumlah pesanan<b>${S.orders.length}</b></div><div class="stat">Selesai<b>${done.length}</b></div>
<div class="stat">Rata-rata order<b>${rp(S.orders.length?Math.round(rev/S.orders.length):0)}</b></div></div>
<h4>Menu terlaris</h4>${top.length?`<table>${top.map(([n,q])=>`<tr><td>${esc(n)}</td><td>${q} terjual</td></tr>`).join('')}</table>`:'<p class="mut">Belum ada pesanan.</p>'}
<h4>Riwayat</h4>${S.orders.length?`<div class="scroll"><table><tr><th>#</th><th>Meja</th><th>Jam</th><th>Total</th><th>Bayar</th><th>Status</th></tr>${S.orders.map(o=>`<tr><td>${o.id}</td><td>${o.table}</td><td>${esc(o.time)}</td><td>${rp(o.total)}</td><td><span class="payst ${o.payst}">${PAYST[o.payst]||o.payst}</span></td><td>${o.status}</td></tr>`).join('')}</table></div>`:'<p class="mut">—</p>'}`}}
async function adv(id){try{const o=S.orders.find(x=>String(x.id)===String(id));if(!o)return;const i=ST.indexOf(o.status);if(i<0||i>=2)return;
const {error}=await sb.from('orders').update({status:ST[i+1]}).eq('id',id);if(error)throw error;
await fetchOrders();renderD();renderC()}catch(e){toast('Gagal update: '+(e.message||e))}}
async function confirmPaid(id){try{const o=S.orders.find(x=>String(x.id)===String(id));if(!o)return;
const {error}=await sb.from('orders').update({payment_status:'lunas'}).eq('id',id);if(error)throw error;
for(const i of o.items){const m=S.menu.find(m=>String(m.id)===String(i.mid))||S.menu.find(m=>m.name===i.name);if(m)await sb.from('menus').update({stock:Math.max(0,m.stock-i.q)}).eq('id',m.id)}
await fetchAll();toast('Pesanan #'+id+' lunas, masuk dapur')}catch(e){toast('Gagal: '+(e.message||e))}}
async function rejectOrder(id){if(!confirm('Tolak pembayaran pesanan #'+id+'?'))return;try{const {error}=await sb.from('orders').update({payment_status:'ditolak'}).eq('id',id);if(error)throw error;await fetchOrders();renderD();renderC()}catch(e){toast('Gagal: '+(e.message||e))}}
async function upd(id,k,v){
try{
if(k=='name'&&!String(v).trim())return renderD();
if(k!='name'&&(isNaN(v)||v<0))return renderD();
const patch=k=='name'?{name:String(v)}:k=='price'?{price:Number(v)}:{stock:Number(v)};
const {error}=await sb.from('menus').update(patch).eq('id',id);if(error)throw error;
toast('Menu diperbarui')}catch(e){toast('Gagal: '+(e.message||e))}}
async function del(id){try{const {error}=await sb.from('menus').delete().eq('id',id);if(error)throw error;delete cart[id]}catch(e){toast('Gagal hapus: '+(e.message||e))}}
async function addM(){const n=document.getElementById('an').value.trim(),p=+document.getElementById('ap').value;if(!n||!p)return toast('Isi nama dan harga');
try{const nid=S.menu.reduce((a,m)=>Math.max(a,m.id),10)+1;
const {error}=await sb.from('menus').insert({id:nid,name:n,price:p,stock:+document.getElementById('as').value||0,category:document.getElementById('ac').value.trim()||'Lainnya',emoji:document.getElementById('ae').value.trim()||'🍽️'});
if(error)throw error;toast('Menu ditambahkan')}catch(e){toast('Gagal tambah: '+(e.message||e))}}
async function resetAll(){if(isKiosk()){toast('Mode pelanggan: reset hanya via dashboard kasir');return}if(!confirm('Hapus semua pesanan dan kembalikan stok awal?'))return;
try{setConn('reset…');
await sb.from('order_items').delete().neq('id',0);
await sb.from('orders').delete().neq('id',0);
for(const m of SEED){await sb.from('menus').upsert({id:m.id,name:m.name,category:m.cat,price:m.price,stock:m.stock,emoji:m.em})}
cart={};step='scan';myId=null;await fetchAll();toast('Demo di-reset')}catch(e){toast('Gagal reset: '+(e.message||e))}}
(function init(){
applyKiosk();
try{const q=new URLSearchParams(location.search);const t=Number(q.get('table'));if(t>=1&&t<=8){table=t;step='menu'}}catch(e){}
renderC();renderD();subscribe();fetchAll().catch(e=>{setConn('offline: '+(e.message||e));toast('Gagal konek Supabase: '+(e.message||e))});
})();
</script>
</body>
</html>
